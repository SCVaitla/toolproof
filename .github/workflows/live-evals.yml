name: live model evals

# Manual only: calls real model APIs and costs money. Add the API keys as repository secrets.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated provider:model specs (use model IDs your providers currently serve)"
        required: true
        default: "anthropic:claude-sonnet-4-5,openai:gpt-5-mini,gemini:gemini-2.5-flash"
      trials:
        description: "Trials per case and condition"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          toolproof eval --models "${{ inputs.models }}" --trials "${{ inputs.trials }}" \
            --conditions clean,chaos --concurrency 4 --out reports/live
          cat reports/live/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-report
          path: reports/live
