name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  go:
    name: go gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  eval-gate:
    name: offline eval + quality gates
    needs: [python, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: pip install -e .
      - name: Run chaos-twin evals with the reference agent
        run: toolproof eval --models mock:golden --conditions clean,chaos --trials 3 --out reports/ci --quiet
      - name: Lint our own MCP tool schemas (strict)
        run: |
          toolproof export-tools --out tools.json
          (cd gate && go run ./cmd/toolproof-gate lint --strict ../tools.json)
      - name: Enforce quality gates
        run: |
          cd gate && go run ./cmd/toolproof-gate check --results ../reports/ci/results.json \
            --min-composite 0.99 --min-pass-rate 1.0 --min-resilience 1.0 \
            --max-blast-radius 0 --max-duplicates 0 --max-invalid-rate 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/ci
