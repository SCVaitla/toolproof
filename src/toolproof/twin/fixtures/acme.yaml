# Acme Corp: a deliberately messy Slack workspace for evals.
# - 60 generated channels sort *before* the interesting ones, so resolving "#releases" by name
#   requires walking several pages of conversations.list.
# - Two people named Priya, a private channel the bot can't see, an archived channel,
#   and an announcement buried under 30 newer messages.
seed: 7
team: {id: T0ACME, name: Acme}
bot:
  user_id: U0BOT1
  token: xoxb-twin-acme-token
  scopes: [channels:read, groups:read, channels:history, groups:history, chat:write,
           reactions:write, users:read, users:read.email]

users:
  - {id: U01PRIYA, name: priya, real_name: Priya Shah, email: priya.shah@acme.dev, title: Engineering Manager}
  - {id: U02MARCUS, name: marcus, real_name: Marcus Webb, email: marcus@acme.dev, title: SRE}
  - {id: U03DIEGO, name: diego, real_name: Diego Alvarez, email: diego@acme.dev, title: Backend Engineer}
  - {id: U04LENA, name: lena, real_name: Lena Fischer, email: lena@acme.dev, title: Product Designer}
  - {id: U05AIKO, name: aiko, real_name: Aiko Tanaka, email: aiko@acme.dev, title: Product Manager}
  - {id: U06PRIYAK, name: priya.k, real_name: Priya Kumar, email: priya.kumar@acme.dev, title: Data Scientist}
  - {id: U0BOT1, name: toolproof-bot, real_name: toolproof bot, is_bot: true}

channels:
  - {id: C0GENERAL, name: general, topic: Company-wide announcements}
  - {id: C0RELEASES, name: releases, topic: Release train and deploy announcements}
  - {id: C0INCIDENT, name: incidents, topic: Active incidents. One thread per incident.}
  - {id: C0ENGBACK, name: eng-backend, topic: Backend engineering}
  - {id: C0DESIGN, name: design, topic: "Design crit (moved to #design-v2)", is_archived: true}
  - {id: C0ONCALL, name: oncall, topic: On-call coordination, is_private: true,
     members: [U02MARCUS, U03DIEGO, U0BOT1]}
  - {id: C0LEADERS, name: leadership, topic: Leadership, is_private: true, members: [U01PRIYA, U05AIKO]}
  - {id: C0RANDOM, name: random, topic: Water cooler}

generate:
  channels: 60
  users: 40
  filler:
    - {channel: general, count: 30, start_ts: 1730010100}
    - {channel: random, count: 80, start_ts: 1729000000}

